<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horarios Académicos - UPeU Juliaca</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { upeu: { DEFAULT: "#003865", dark: "#002548", mid: "#004e8c" } },
          keyframes: { fadeIn: { from: { opacity: 0 }, to: { opacity: 1 } } },
          animation:  { fadeIn: "fadeIn .25s ease" }
        }
      }
    }
  </script>
  <style>
    /* Clases dinámicas usadas en app.js – precompila en Play CDN */
    .tw-safelist {
      display: none !important;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

  <!-- ══════════ HERO ══════════ -->
  <div class="relative w-full h-72 sm:h-80 overflow-hidden">

    <!-- Imagen campus -->
    <img src="campus-juliaca.webp" alt="Campus UPeU Juliaca"
         class="absolute inset-0 w-full h-full object-cover object-[center_60%]">

    <!-- Gradiente oscuro -->
    <div class="absolute inset-0 bg-gradient-to-b from-[#003865]/80 via-[#003865]/55 to-[#003865]/40"></div>

    <!-- Logo — arriba izquierda -->
    <img src="logo-upeu-white.png" alt="Logo UPeU"
         class="absolute top-4 left-5 h-16 sm:h-20 w-auto drop-shadow-xl z-10"
         onerror="this.style.display='none'">

    <!-- Botón Admin — arriba derecha -->
    <a href="admin.html"
       class="absolute top-4 right-5 z-10 inline-flex items-center gap-2
              bg-white/15 hover:bg-white/25 border border-white/35
              text-white text-xs sm:text-sm font-semibold
              px-3 py-2 sm:px-4 rounded-xl backdrop-blur-sm transition-colors select-none">
      ⚙️ <span class="hidden sm:inline">Administrador</span><span class="sm:hidden">Admin</span>
    </a>

    <!-- Texto centrado -->
    <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-28 sm:px-44 pointer-events-none">
      <h1 class="text-white text-2xl sm:text-4xl font-extrabold drop-shadow-lg leading-tight tracking-tight">
        Bienvenido al Ciclo Acad&eacute;mico 2026-1
      </h1>
      <p class="mt-2 text-blue-100 text-sm sm:text-lg drop-shadow">
        Universidad Peruana Uni&oacute;n &mdash; Filial Juliaca
      </p>
    </div>
  </div>

  <!-- ══════════ SUBTÍTULO ══════════ -->
  <header class="text-center py-6 px-4 border-b border-slate-200 bg-white">
    <h2 class="text-lg sm:text-xl font-bold text-[#003865]">
      Horarios Acad&eacute;micos &mdash; Ciclo 2026-1
    </h2>
  </header>

  <!-- ══════════ MAIN ══════════ -->
  <main class="flex-1 px-4 sm:px-6 pb-12">

    <!-- Spinner -->
    <div id="loadingSpinner" class="flex flex-col items-center justify-center gap-4 py-20 text-[#003865]">
      <div class="w-12 h-12 border-4 border-blue-100 border-t-[#003865] rounded-full animate-spin"></div>
      <span class="text-sm text-slate-500">Cargando horarios desde Firebase&hellip;</span>
    </div>

    <!-- Contenido (oculto hasta que carguen los datos) -->
    <div id="appContent" style="display:none">
      <nav id="schoolNav" class="flex flex-wrap justify-center gap-2 py-6"></nav>
      <div id="schoolContent"></div>
    </div>

  </main>

  <!-- ══════════ FOOTER ══════════ -->
  <footer class="bg-slate-100 border-t border-slate-200 text-center text-xs text-slate-500 py-4 space-y-1">
    <p>&copy; 2026 Universidad Peruana Uni&oacute;n Filial Juliaca</p>
    <p>Todos los horarios est&aacute;n sujetos a cambios</p>
  </footer>

  <!-- ══════════ MODAL PDF ══════════ -->
  <div id="pdfModal"
       style="display:none"
       class="fixed inset-0 z-50 bg-black/60 flex items-start justify-center overflow-y-auto py-8 px-3">
    <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden animate-fadeIn">
      <div class="flex items-center justify-between bg-[#003865] px-5 py-3">
        <span id="modalTitle" class="text-white font-semibold text-sm sm:text-base truncate pr-4"></span>
        <button id="closeModal"
                class="text-white/80 hover:text-white text-2xl leading-none font-bold shrink-0 transition-colors">
          &times;
        </button>
      </div>
      <iframe id="pdfFrame" class="w-full border-none" style="height:65vh" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Precompila clases dinámicas de app.js para Tailwind Play CDN -->
  <div class="tw-safelist
    grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-4xl mx-auto
    bg-white rounded-2xl shadow hover:shadow-lg hover:-translate-y-1 transition-all duration-200 overflow-hidden flex flex-col
    w-full h-52 object-cover
    p-5 text-center flex-1 justify-between
    text-base font-semibold text-gray-800 mb-4 leading-snug
    ver-horario w-full bg-[#003865] hover:bg-[#002548] active:scale-95 text-white py-2.5 rounded-xl text-sm font-semibold transition-all
    text-2xl font-bold text-gray-800 mb-8
    mt-14 text-center max-w-4xl mx-auto
    text-xl font-semibold text-[#003865] mb-5
    rounded-2xl overflow-hidden shadow-md">
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
